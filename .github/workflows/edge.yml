name: Deploy web to Cloudflare

# main 的 CI 通過後，把網頁部署到 Cloudflare Workers（wrangler.jsonc）：靜態檔走 CDN 不會睡，/api 轉給 Render。
# 需要 repo 的 secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID；還沒設定就跳過。
# 選用：variable SENTRY_DSN、SENTRY_ORG、SENTRY_PROJECT 和 secret SENTRY_AUTH_TOKEN（錯誤追蹤、上傳 source map，跟 Render 上一樣）。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ok
        with:
          # 部署 CI 測過的那個 commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ok
        with:
          node-version: 24
          cache: npm
      - if: steps.ready.outputs.ok
        run: npm ci
      - name: Build the web app
        if: steps.ready.outputs.ok
        run: npm run build
        env:
          APP_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Deploy
        if: steps.ready.outputs.ok
        run: npx wrangler deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
