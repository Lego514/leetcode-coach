name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 前端單元測試，以及後端與端對端同步測試（PGlite，不需要另外準備資料庫）
      - run: npm test
      - run: npm run build:all

  e2e:
    runs-on: ubuntu-latest
    # 用真正的 PostgreSQL 跑正式環境的建置，跟部署後的設定一樣
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://coach:coach@localhost:5432/coach
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:all
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # 用 Docker 建映像，跟 PostgreSQL 一起跑起來，再對容器跑幾個端對端測試：
  # 確認映像裡的網頁、API、migration 和資料庫連線都正常
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the app with PostgreSQL
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check the API and the web app
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep app
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the container
        run: npx playwright test --project=chromium e2e/sync.spec.ts e2e/today.spec.ts e2e/board.spec.ts e2e/board-share.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Show the container logs
        if: failure()
        run: docker compose logs
