# Render Blueprint：一個 Node 服務同時提供 API 與網頁。
# 使用前先在 Neon 之類的服務建立 PostgreSQL，建立 Blueprint 時填入 DATABASE_URL。
# 步驟見 README 的 Deploying 一節。
services:
  - type: web
    name: leetcode-coach
    runtime: node
    plan: free
    # 跟 Neon 的 AWS US East 2（Ohio）放在同一區，也離美東的使用者比較近
    region: ohio
    # main 分支的 CI 通過後才部署
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build:all
    startCommand: npm start
    # 健康檢查不碰資料庫，免得 Neon 一直被喚醒
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # AI 講解回饋；留空就停用
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "20"
      # 可以用 AI 回饋的帳號 email，用逗號分隔；留空就沒有人能用，* 表示所有帳號
      - key: AI_ALLOWED_EMAILS
        sync: false
      # 可以看回報收件匣的帳號 email，用逗號分隔；留空時回報照樣會存，只是沒人看得到收件匣
      - key: ADMIN_EMAILS
        sync: false
      # 忘記密碼的重設信；留空就停用
      - key: BREVO_API_KEY
        sync: false
      # 用 GitHub 登入（GitHub 的 OAuth App）；兩個都填才啟用
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # 每日提醒（推播）：npx web-push generate-vapid-keys 產生一對金鑰；留空就停用
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # 選用：推播服務聯絡你的 mailto: 或網址，沒設定用 APP_URL
      - key: VAPID_SUBJECT
        sync: false
      # GitHub Actions 每小時呼叫 /api/push/send-due 時帶的密碼，repo 的 Actions secret 也要設一樣的
      - key: CRON_SECRET
        sync: false
      # 錯誤追蹤（Sentry）；留空就停用。DSN 前後端共用
      - key: SENTRY_DSN
        sync: false
      # 選用：建置時上傳 source map 給 Sentry，錯誤會指到原本的 TypeScript
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: MAIL_FROM
        sync: false
